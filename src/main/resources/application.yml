spring:
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=dinner_bot;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:YourStrong@Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8

bot:
  token: ${BOT_TOKEN:}
  timezone: Asia/Ho_Chi_Minh
  # Cổng health check: GET http://<host>:6970/health
  http-port: ${PORT:6970}

logging:
  level:
    com.kai.dinnerbot: INFO
